<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TrungDuKy</title>

        <!-- Favicon -->
        <link
            rel="icon"
            type="image/png"
            href="/assets/sources/favicon/favicon-96x96.png"
            sizes="96x96"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/sources/favicon/favicon.svg"
        />
        <link rel="shortcut icon" href="/assets/sources/favicon/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/assets/sources/favicon/apple-touch-icon.png"
        />
        <link rel="manifest" href="/assets/sources/favicon/site.webmanifest" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <!-- CSS -->
        <link rel="stylesheet" href="./assets/css/reset.css" />
        <link rel="stylesheet" href="./assets/css/index.css" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <link rel="stylesheet" href="./assets/css/rangeslider.css" />
        <link rel="stylesheet" href="./assets/css/responsive.css" />
    </head>
    <body>
        <header class="site-header">
            <div class="wrap site-header__row">
                <a href="#top" class="logo">
                    <span class="logo__mark"
                        ><img src="./assets/sources/img/logo.jpg" alt=""
                    /></span>
                    TrungDuKy
                </a>
                <nav class="site-nav" aria-label="Primary">
                    <a href="index.html">Home</a>
                    <a href="function.html">Plan a Trip</a>
                    <a href="about.html">About us</a>
                </nav>
            </div>
        </header>

        <div class="row destinations__container">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="sidebar-sticky">
                    <form class="card" id="prefsForm">
                        <div class="header">
                            <div class="function-avatar">
                                <img
                                    src="./assets/sources/img/logo.jpg"
                                    alt=""
                                />
                            </div>
                            <div class="title-group">
                                <h1>TrungDuKy</h1>
                                <p>Tell us what you're looking for</p>
                            </div>
                        </div>

                        <div id="sliders"></div>

                        <div class="divider"></div>

                        <div class="month-heading">
                            Best months to travel
                            <span>Tap the months that work for you</span>
                        </div>
                        <div class="months" id="months"></div>

                        <div class="trip-details">
                            <div class="trip-field">
                                <label for="days">Trip length (days)</label>
                                <div class="stepper">
                                    <button
                                        type="button"
                                        id="daysMinus"
                                        aria-label="Decrease days"
                                    >
                                        –
                                    </button>
                                    <input
                                        type="number"
                                        id="days"
                                        name="days"
                                        min="1"
                                        max="20"
                                        value="3"
                                        inputmode="numeric"
                                    />
                                    <button
                                        type="button"
                                        id="daysPlus"
                                        aria-label="Increase days"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                            <div class="trip-field">
                                <label for="topK">Show top</label>
                                <div class="stepper">
                                    <button
                                        type="button"
                                        id="kMinus"
                                        aria-label="Decrease number of results"
                                    >
                                        –
                                    </button>
                                    <input
                                        type="number"
                                        id="topK"
                                        name="topK"
                                        min="1"
                                        max="42"
                                        value="10"
                                        inputmode="numeric"
                                    />
                                    <button
                                        type="button"
                                        id="kPlus"
                                        aria-label="Increase number of results"
                                    >
                                        +
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="submit">
                            Save preferences
                        </button>
                    </form>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-8">
                <div class="destinations__showing">
                    Showing 0 places of 42 places
                </div>
                <div
                    class="destinations__grid row g-3 row-cols-1 row-cols-xl-2"
                ></div>

                <div class="itinerary">
                    <div class="itinerary__header">
                        <div>
                            <div class="itinerary__eyebrow">Itinerary</div>
                            <h1 class="itinerary__title">
                                Plan Your Trip by Day
                            </h1>
                            <div class="itinerary__summary">
                                0 selected · estimated 0 km and 0 minutes,
                                velocity: 40 km per hour
                            </div>
                        </div>
                    </div>

                    <div class="days-grid"></div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <div class="wrap site-footer__row">
                <a href="#top" class="logo logo--small">
                    <span class="logo__mark"
                        ><img src="./assets/sources/img/logo.jpg" alt=""
                    /></span>
                    TrungDuKy
                </a>
                <span class="site-footer__copy">© 2026 TrungDuKy</span>
            </div>
        </footer>

        <!-- Bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <!-- JS -->
        <script type="module" src="./assets/js/main.js"></script>
    </body>
</html>
